# Read the documentation: https://symfony.com/doc/current/bundles/StofDoctrineExtensionsBundle/index.html
# See the official DoctrineExtensions documentation for more details: https://github.com/doctrine-extensions/DoctrineExtensions/tree/main/doc
stof_doctrine_extensions:
    # Locale used by the extensions that are locale-aware (Translatable, Sluggable
    # transliteration). Change it if your project is not English-first.
    default_locale: en_US
    orm:
        default:
            # createdAt / updatedAt via Gedmo\Timestampable\Traits\TimestampableEntity
            timestampable: true
            # deletedAt via Gedmo\SoftDeleteable\Traits\SoftDeleteableEntity; the
            # matching query filter is enabled in doctrine.yaml
            softdeleteable: true
            # createdBy / updatedBy via Gedmo\Blameable\Traits\BlameableEntity.
            # Needs an authenticated user to stamp — harmless while there is none.
            blameable: true
