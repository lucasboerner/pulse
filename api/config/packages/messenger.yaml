framework:
    messenger:
        failure_transport: failed

        transports:
            # Background work queue (Doctrine-backed). auto_setup creates the
            # messenger_messages table on first use; the `worker` compose service
            # drains it. Route long-running work here to keep it off the request.
            async: 'doctrine://default?queue_name=async'
            failed: 'doctrine://default?queue_name=failed'

        # Map message classes to a transport, e.g.
        #   App\Message\SomeMessage: async
        # Anything unmapped is handled synchronously in-process — DispatchDueChecks
        # stays unrouted so the scheduler consumer handles it where it is received.
        routing:
            App\Message\RunCheck: async
            # Alert mail off the check loop: an SMTP outage delays notifications
            # without blocking the worker that drains RunCheck.
            App\Message\NotifyIncident: async
            # Rollup + retention on the worker, unlike DispatchDueChecks: aggregating
            # and deleting tens of thousands of rows must not stall the scheduler
            # consumer's 15-second check tick.
            App\Message\RollUpChecks: async

when@test:
    framework:
        messenger:
            # In tests nothing is consumed: dispatches land in memory so they can
            # be asserted without a worker.
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'
